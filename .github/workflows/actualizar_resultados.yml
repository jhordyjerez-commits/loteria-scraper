name: Actualizar resultados de loteria

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar navegador de Playwright
        run: playwright install --with-deps chromium

      - name: Correr el raspador
        run: python scraper.py

      - name: Detective
        run: python detective.py

      - name: Guardar los resultados actualizados en el repositorio
        run: |
          git config --global user.name "Actualizador Automático"
          git config --global user.email "actions@github.com"
          git add resultados.json
          git diff --staged --quiet || git commit -m "Actualizar resultados $(date +'%Y-%m-%d')"
          git push
